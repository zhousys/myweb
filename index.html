<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人现金流与流动性风险测算系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }
        body {
            max-width: 1400px;
            margin: 24px auto;
            padding: 0 20px;
            background-color: #f0f2f5;
        }
        h1 {
            color: #1f2937;
            text-align:center;
        }
        .card {
            background: #ffffff;
            padding:24px;
            border-radius:16px;
            margin-bottom:20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .card-header-row{
            display:flex;
            justify-content: space-between;
            align-items:center;
        }
        h2 {
            color:#2563eb;
            border-left:5px solid #2563eb;
            padding-left:12px;
            margin:0;
        }
        .header-btn-group{
            display:flex;
            gap:8px;
        }
        .row {
            display:flex;
            gap:14px;
            flex-wrap:wrap;
            align-items:center;
            margin:12px 0;
        }
        .row-full{
            display:flex;
            gap:14px;
            flex-wrap:wrap;
            align-items:center;
            margin:12px 0;
        }
        input, select, textarea {
            padding:9px 12px;
            font-size:15px;
            border:1px solid #d1d5db;
            border-radius:8px;
            outline:none;
        }
        input:focus, select:focus, textarea:focus {
            border-color:#2563eb;
        }
        button {
            padding:8px 12px;
            font-size:14px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            transition: 0.2s;
        }
        .btn-add {
            background-color:#2563eb;
            color:white;
        }
        .btn-add:hover {
            background-color:#1d4ed8;
        }
        .btn-del {
            background-color:#ef4444;
            color:white;
            padding:6px 10px;
            font-size:13px;
        }
        .btn-clear-filter{
            background-color:#991b1b;
            color:white;
        }
        .btn-export{
            background-color:#059669;
            color:white;
        }
        table {
            width:100%;
            border-collapse: collapse;
            margin-top:10px;
        }
        th,td {
            border:1px solid #e5e7eb;
            padding:12px;
            text-align:center;
        }
        th {
            background-color:#eff6ff;
            color:#1e40af;
        }
        .grid-container {
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:20px;
        }
        .ok {
            color:#16a34a;
            font-weight:bold;
        }
        .warn {
            color:#dc2626;
            font-weight:bold;
        }
        .info-item {
            font-size:15px;
            margin:8px 0;
        }
        canvas {
            max-height:320px;
            margin-top:16px;
        }
        textarea{
            resize:none;
        }
    </style>
</head>
<body>
    <h1>个人现金流与流动性风险测算系统</h1>

    <!-- 录入区域 -->
    <div class="card">
        <h2>📝 记账录入区</h2>
        <div class="row">
            <label>日期：</label>
            <input type="date" id="recordDate">

            <label>收支大类：</label>
            <select id="category" onchange="updateSubItemList()">
                <option value="收入">收入</option>
                <option value="刚性支出">刚性支出</option>
                <option value="弹性支出">弹性支出</option>
                <option value="储蓄储备">储蓄储备</option>
            </select>

            <label>子项目：</label>
            <select id="subItem">
            </select>

            <label>金额(元)：</label>
            <input type="number" id="amount" placeholder="输入金额" min="0" step="0.01">
        </div>
        <div class="row-full">
            <label>备注描述：</label>
            <textarea id="remark" placeholder="自定义描述，例如：考研兼职、采购复习资料" cols="50" rows="2"></textarea>
            <button class="btn-add" onclick="addRecord()">添加记录</button>
        </div>
    </div>

    <!-- 流水区域 -->
    <div class="card">
        <div class="card-header-row">
            <h2>📋 流水明细表</h2>
            <div class="header-btn-group">
                <button class="btn-export" onclick="exportCSV()">导出筛选流水CSV</button>
                <button class="btn-clear-filter" onclick="deleteFilterRecords()">批量删除筛选记录</button>
            </div>
        </div>
        <div style="margin:10px 0;">
            <span>筛选：</span>
            <select id="yearSelector" onchange="renderAll()">
                <option value="">全部年份</option>
            </select>
            <select id="monthSelector" onchange="renderAll()">
                <option value="">全部月份</option>
                <option value="1">1月</option>
                <option value="2">2月</option>
                <option value="3">3月</option>
                <option value="4">4月</option>
                <option value="5">5月</option>
                <option value="6">6月</option>
                <option value="7">7月</option>
                <option value="8">8月</option>
                <option value="9">9月</option>
                <option value="10">10月</option>
                <option value="11">11月</option>
                <option value="12">12月</option>
            </select>
        </div>
        <table>
            <thead>
                <tr>
                    <th>日期</th>
                    <th>收支大类</th>
                    <th>子项目</th>
                    <th>金额(元)</th>
                    <th>备注描述</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 分析面板：左侧文字，右侧圆盘饼图 -->
    <div class="grid-container">
        <div class="card">
            <h2 id="panelTitle">📊 财务分析</h2>
            <div id="infoPanel"></div>
        </div>
        <div class="card">
            <h2 id="secondPanelTitle">📈 本月收支饼图</h2>
            <p>本月资金分配占比</p>
            <canvas id="pieChartCanvas"></canvas>
        </div>
    </div>

<script>
let records = JSON.parse(localStorage.getItem("financeRecords")) || [];
let pieChart = null;
// 保存当前筛选后的流水（给导出/批量删除使用）
let showRecordsCache = [];

// 子项目配置：按收支大类分组
const subItemConfig = {
    "收入": ["生活费", "兼职收入"],
    "刚性支出": ["食堂食宿", "话费网费", "学习资料", "医疗开销"],
    "弹性支出": ["外食餐饮", "服饰日用品", "娱乐休闲", "交通出行"],
    "储蓄储备": ["应急储备存入"]
};

// 切换大类，更新子项目下拉
function updateSubItemList(){
    const cate = document.getElementById("category").value;
    const subSelect = document.getElementById("subItem");
    const optionList = subItemConfig[cate];
    subSelect.innerHTML = "";
    optionList.forEach(name=>{
        subSelect.innerHTML += `<option value="${name}">${name}</option>`
    })
}

// 添加记录
function addRecord() {
    const date = document.getElementById("recordDate").value;
    const cate = document.getElementById("category").value;
    const sub = document.getElementById("subItem").value;
    const amt = Number(document.getElementById("amount").value);
    const remark = document.getElementById("remark").value.trim();
    if (!date || isNaN(amt) || amt <= 0) {
        alert("请填写合法日期和金额！");
        return;
    }
    records.push({ date, category: cate, subItem: sub, amount: amt, remark: remark });
    saveData();
    renderAll();
    document.getElementById("amount").value = "";
    document.getElementById("remark").value = "";
}

// 删除单条记录
function delRecord(idx) {
    records.splice(idx, 1);
    saveData();
    renderAll();
}

// 批量删除当前筛选出来的记录（某年某月）
function deleteFilterRecords(){
    if(showRecordsCache.length ===0){
        alert("当前筛选条件下没有流水记录");
        return;
    }
    if(confirm(`⚠️确认删除当前筛选到的 ${showRecordsCache.length} 条记录？操作不可恢复！`)){
        // 找出筛选出来记录，过滤删除
        records = records.filter(r => !showRecordsCache.includes(r));
        saveData();
        renderAll();
    }
}

//导出CSV：导出当前筛选后的流水
function exportCSV(){
    if(showRecordsCache.length ===0){
        alert("当前筛选条件下没有流水记录，无法导出");
        return;
    }
    //表头
    let csv = "日期,收支大类,子项目,金额(元),备注描述\n";
    showRecordsCache.forEach(item=>{
        //处理逗号，防止csv格式错乱
        let remark = `"${(item.remark||"").replace(/"/g,'""')}"`;
        csv += `${item.date},${item.category},${item.subItem},${item.amount.toFixed(2)},${remark}\n`;
    })
    const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `财务流水_${new Date().toLocaleDateString()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function saveData() {
    localStorage.setItem("financeRecords", JSON.stringify(records));
}

// 解析日期，返回 {year,month,ym}
function parseDateStr(d) {
    const arr = d.split("-");
    return {
        year: parseInt(arr[0]),
        month: parseInt(arr[1]),
        ym: `${arr[0]}-${arr[1]}`
    }
}

function renderAll() {
    // =========构建年份下拉列表=========
    const yearSelect = document.getElementById("yearSelector");
    const yearSet = new Set();
    records.forEach(r => {
        const dt = parseDateStr(r.date);
        yearSet.add(dt.year);
    })
    const oldYearVal = yearSelect.value;
    yearSelect.innerHTML = `<option value="">全部年份</option>`;
    Array.from(yearSet).sort((a,b)=>a-b).forEach(y=>{
        yearSelect.innerHTML += `<option value="${y}">${y}</option>`
    })
    yearSelect.value = oldYearVal;

    // 获取筛选条件
    const selYear = yearSelect.value;
    const selMonth = document.getElementById("monthSelector").value;

    // =========筛选流水=========
    let showRecords = records;
    let mode = null; // month / year / all
    let targetYear = null;
    let targetMonth = null;

    if(selYear !== ""){
        targetYear = parseInt(selYear);
        showRecords = showRecords.filter(r=> parseDateStr(r.date).year === targetYear);
        if(selMonth !== ""){
            // 指定年+指定月：月度模式
            mode = "month";
            targetMonth = parseInt(selMonth);
            showRecords = showRecords.filter(r=> parseDateStr(r.date).month === targetMonth);
        }else{
            // 指定年份 + 全部月份：年度模式
            mode = "year";
        }
    }else{
        if(selMonth !== ""){
            //全部年份+指定月份
            mode = "month";
            targetMonth = parseInt(selMonth);
            showRecords = showRecords.filter(r=> parseDateStr(r.date).month === targetMonth);
        }else{
            //全部年份+全部月份
            mode = "all";
        }
    }
    showRecordsCache = showRecords; //缓存筛选结果，用于导出、批量删除

    // 渲染流水表格
    const tbody = document.getElementById("tableBody");
    tbody.innerHTML = "";
    showRecords.forEach((r, idx) => {
        const realIdx = records.indexOf(r);
        const remarkText = r.remark? r.remark:"-";
        tbody.innerHTML += `<tr>
            <td>${r.date}</td>
            <td>${r.category}</td>
            <td>${r.subItem}</td>
            <td>${r.amount.toFixed(2)}</td>
            <td>${remarkText}</td>
            <td><button class="btn-del" onclick="delRecord(${realIdx})">删除</button>
        </tr>`
    })

    //【全局累计应急储备：全部历史储蓄储备记录，不随筛选变化！】
    const totalEmergencyAll = records.filter(r => r.category === "储蓄储备").reduce((s, item) => s + item.amount, 0);

    // ========== 被筛选范围内的数据统计 ==========
    let income = 0, rigid = 0, flex = 0, saveReserve = 0;
    showRecords.forEach(r => {
        if (r.category === "收入") income += r.amount;
        else if (r.category === "刚性支出") rigid += r.amount;
        else if (r.category === "弹性支出") flex += r.amount;
        else if (r.category === "储蓄储备") saveReserve += r.amount;
    })
    const surplus = income - rigid - flex;
    const saveRate = income > 0 ? surplus / income : 0;

    // 构建饼图数据，过滤掉0
    let pieData = [];
    let pieLabel = [];
    let pieColor = [];
    if(rigid>0){pieData.push(rigid);pieLabel.push("刚性支出");pieColor.push("#ef4444");}
    if(flex>0){pieData.push(flex);pieLabel.push("弹性支出");pieColor.push("#f59e0b");}
    if(surplus>0){pieData.push(surplus);pieLabel.push("净储蓄");pieColor.push("#10b981");}
    // 没有任何数据时
    if(pieData.length === 0){
        pieData = [1];
        pieLabel = ["暂无收支"];
        pieColor = ["#cccccc"];
    }

    //销毁旧饼图
    if(pieChart) pieChart.destroy();
    const pieCtx = document.getElementById("pieChartCanvas").getContext("2d");
    pieChart = new Chart(pieCtx, {
        type:"pie", //圆盘饼图
        data:{
            labels:pieLabel,
            datasets:[{
                data:pieData,
                backgroundColor:pieColor
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:true
        }
    })

    // 文字面板
    const panelTitle = document.getElementById("panelTitle");
    const infoPanel = document.getElementById("infoPanel");
    const secondPanelTitle = document.getElementById("secondPanelTitle");

    if (mode === "month") {
        panelTitle.innerText = `📊 ${targetYear?targetYear+"年":""}${targetMonth}月 月度财务分析`;
        secondPanelTitle.innerText = `📈 ${targetYear?targetYear+"年":""}${targetMonth}月收支饼图`;
        const emergencyStandard = rigid * 3;
        const emergencyTip = totalEmergencyAll >= emergencyStandard
            ? `<span class="ok">✅应急储备达标</span>`
            : `<span class="warn">❌应急储备不足</span>`;
        infoPanel.innerHTML = `
            <div class="info-item">本月总收入：${income.toFixed(2)} 元</div>
            <div class="info-item">本月刚性总支出：${rigid.toFixed(2)} 元</div>
            <div class="info-item">本月弹性总支出：${flex.toFixed(2)} 元</div>
            <div class="info-item">本月净储蓄：${surplus.toFixed(2)} 元</div>
            <div class="info-item">本月储蓄率：${(saveRate * 100).toFixed(2)} %</div>
            <div class="info-item">3个月刚性支出底线：${emergencyStandard.toFixed(2)}元</div>
            <div class="info-item">累计应急储备（全部历史）：${totalEmergencyAll.toFixed(2)}元 ${emergencyTip}</div>
        `;
    } else if (mode === "year") {
        panelTitle.innerText = `📊 ${targetYear}年 年度财务总览`;
        secondPanelTitle.innerText = `📈 ${targetYear}年收支饼图`;
        infoPanel.innerHTML = `
            <div class="info-item">全年总收入：${income.toFixed(2)} 元</div>
            <div class="info-item">全年刚性总支出：${rigid.toFixed(2)} 元</div>
            <div class="info-item">全年弹性总支出：${flex.toFixed(2)} 元</div>
            <div class="info-item">全年净储蓄：${surplus.toFixed(2)} 元</div>
            <div class="info-item">全年平均储蓄率：${(saveRate * 100).toFixed(2)} %</div>
            <div class="info-item">累计应急储备（全部历史）：${totalEmergencyAll.toFixed(2)}元</div>
        `;
    } else {
        panelTitle.innerText = `📊 全部记录汇总`;
        secondPanelTitle.innerText = `📈 全部收支饼图`;
        infoPanel.innerHTML = `
            <div class="info-item">总收入：${income.toFixed(2)} 元</div>
            <div class="info-item">刚性总支出：${rigid.toFixed(2)} 元</div>
            <div class="info-item">弹性总支出：${flex.toFixed(2)} 元</div>
            <div class="info-item">净储蓄总额：${surplus.toFixed(2)} 元</div>
            <div class="info-item">储蓄率：${(saveRate * 100).toFixed(2)} %</div>
            <div class="info-item">累计应急储备：${totalEmergencyAll.toFixed(2)}元</div>
        `;
    }
}
//页面加载初始化子项目
updateSubItemList();
renderAll();
</script>
</body>
</html>
